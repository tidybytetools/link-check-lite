[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "link-check-lite"
version = "1.1.3"
description = "Check a file of links for status codes and redirects. Has a CLI and an MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tidy Byte Tools"}]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
]
keywords = ["links", "link-checker", "broken-links", "redirects", "http", "status-code", "cli", "mcp", "mcp-server"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tidybyte.gumroad.com/l/link-check"
Source = "https://github.com/tidybytetools/link-check-lite"
Issues = "https://github.com/tidybytetools/link-check-lite/issues"
Changelog = "https://github.com/tidybytetools/link-check-lite/blob/main/CHANGELOG.md"

[project.scripts]
link-check-lite = "link_check_lite:main"
link-check-lite-mcp = "link_check_lite_mcp:main"

[tool.setuptools]
py-modules = ["link_check_lite", "link_check_lite_mcp"]
