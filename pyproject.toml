[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "link-check-lite"
version = "1.0.0"
description = "Check a file of links for status codes and redirects. Has a CLI and an MCP server."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "tidybyte"}]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]
keywords = ["links", "broken-links", "redirects", "http", "status-code", "cli", "mcp", "mcp-server"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
]

[project.urls]
"Paid version" = "https://tidybyte.gumroad.com/l/LINK_CHECK_PAID_URL"
Source = "https://github.com/tidybytetools/link-check-lite"
Shop = "https://tidybyte.gumroad.com"

[project.scripts]
link-check-lite = "link_check_lite:main"
link-check-lite-mcp = "link_check_lite_mcp:main"

[tool.setuptools]
py-modules = ["link_check_lite", "link_check_lite_mcp"]
